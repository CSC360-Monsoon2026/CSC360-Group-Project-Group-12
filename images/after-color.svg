  <text x="450" y="580" font-family="Arial, sans-serif" font-size="13" fill="#444" text-anchor="middle">Click a button to modify the browser DOM</text>

  <g font-family="Arial, sans-serif" font-size="14" font-weight="bold">
    <rect x="280" y="596" width="140" height="40" rx="6" fill="#4a6ee0"/>
