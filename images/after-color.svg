<svg width="900" height="650" viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="650" fill="#e8e8ec"/>

  <rect x="0" y="0" width="900" height="34" fill="#3b3f46"/>
