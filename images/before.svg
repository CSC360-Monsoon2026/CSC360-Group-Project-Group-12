<svg width="900" height="650" viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- window background -->
  <rect width="900" height="650" fill="#e8e8ec"/>

  <!-- title bar -->
  <rect x="0" y="0" width="900" height="34" fill="#3b3f46"/>
  <circle cx="18" cy="17" r="6" fill="#ff5f57"/>
  <circle cx="38" cy="17" r="6" fill="#febc2e"/>
  <circle cx="58" cy="17" r="6" fill="#28c840"/>
  <text x="450" y="22" font-family="Arial, sans-serif" font-size="14" fill="#e5e5e5" text-anchor="middle">SC360 Group 12 - JavaFX WebView DOM Controller</text>

  <!-- WebView / browser content area -->
  <rect x="20" y="54" width="860" height="500" fill="#ffffff" stroke="#c9c9d1" stroke-width="1"/>
  <!-- fake browser address strip -->
  <rect x="20" y="54" width="860" height="26" fill="#f2f2f5" stroke="#c9c9d1" stroke-width="1"/>
  <text x="34" y="72" font-family="Arial, sans-serif" font-size="12" fill="#888">file:///.../page.html</text>

  <!-- page content (matches page.html, original state) -->
  <rect x="20" y="80" width="860" height="474" fill="#f4f4f9"/>
  <text x="450" y="200" font-family="Arial, sans-serif" font-size="30" fill="#333333" text-anchor="middle" font-weight="bold">Hello, this is the original text!</text>
  <text x="450" y="235" font-family="Arial, sans-serif" font-size="15" fill="#666666" text-anchor="middle">Waiting for JavaFX to make a change...</text>

  <!-- bottom status label -->
  <text x="450" y="580" font-family="Arial, sans-serif" font-size="13" fill="#444" text-anchor="middle">Click a button to modify the browser DOM</text>

  <!-- button bar -->
  <g font-family="Arial, sans-serif" font-size="14" font-weight="bold">
    <rect x="280" y="596" width="140" height="40" rx="6" fill="#4a6ee0"/>
    <text x="350" y="621" fill="#ffffff" text-anchor="middle">Change Text</text>

    <rect x="435" y="596" width="150" height="40" rx="6" fill="#4a6ee0"/>
    <text x="510" y="621" fill="#ffffff" text-anchor="middle">Change Color</text>

    <rect x="600" y="596" width="130" height="40" rx="6" fill="#8b8f99"/>
    <text x="665" y="621" fill="#ffffff" text-anchor="middle">Reset Page</text>
  </g>

  <!-- cursor pointing to Change Text button, about to click -->
  <path d="M340 590 L340 640 L352 630 L360 645 L368 641 L360 626 L375 626 Z" fill="#111" stroke="#fff" stroke-width="1.5"/>
</svg>
