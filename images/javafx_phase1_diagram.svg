<svg viewBox="0 0 1100 900" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4A5568"/>
    </marker>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1100" height="900" fill="#F7F9FC"/>

  <!-- Title -->
  <rect x="0" y="0" width="1100" height="80" fill="url(#headerGrad)"/>
  <text x="550" y="35" text-anchor="middle" fill="white" font-size="26" font-weight="700">Phase 1: JavaFX Setup — Methodology</text>
  <text x="550" y="62" text-anchor="middle" fill="#E0E7FF" font-size="14">Setting up and verifying the JavaFX environment before browser/DOM integration</text>

  <!-- Environment box -->
  <rect x="40" y="100" width="1020" height="70" rx="12" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="60" y="128" font-size="14" font-weight="700" fill="#3730A3">Environment</text>
  <text x="60" y="152" font-size="13" fill="#334155">Java 21   •   JavaFX 21   •   Maven   •   IntelliJ IDEA</text>

  <!-- Step boxes -->
  <!-- Row layout: 7 steps in a flow, 4 top row, 3 bottom row -->
  <!-- Step 1 -->
  <g>
    <rect x="40" y="200" width="220" height="90" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
    <circle cx="65" cy="225" r="14" fill="#2563EB"/>
    <text x="65" y="230" text-anchor="middle" fill="white" font-size="13" font-weight="700">1</text>
    <text x="90" y="230" font-size="13" font-weight="600" fill="#1E293B">Set up Java Dev</text>
    <text x="90" y="248" font-size="13" font-weight="600" fill="#1E293B">Environment</text>
  </g>

  <!-- Step 2 -->
  <g>
    <rect x="300" y="200" width="220" height="90" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
    <circle cx="325" cy="225" r="14" fill="#2563EB"/>
    <text x="325" y="230" text-anchor="middle" fill="white" font-size="13" font-weight="700">2</text>
    <text x="350" y="230" font-size="13" font-weight="600" fill="#1E293B">Create JavaFX</text>
    <text x="350" y="248" font-size="13" font-weight="600" fill="#1E293B">Project via Maven</text>
  </g>

  <!-- Step 3 -->
  <g>
    <rect x="560" y="200" width="220" height="90" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
    <circle cx="585" cy="225" r="14" fill="#2563EB"/>
    <text x="585" y="230" text-anchor="middle" fill="white" font-size="13" font-weight="700">3</text>
    <text x="610" y="230" font-size="13" font-weight="600" fill="#1E293B">Add JavaFX</text>
    <text x="610" y="248" font-size="13" font-weight="600" fill="#1E293B">Dependencies</text>
  </g>

  <!-- Step 4 -->
  <g>
    <rect x="820" y="200" width="220" height="90" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
    <circle cx="845" cy="225" r="14" fill="#2563EB"/>
    <text x="845" y="230" text-anchor="middle" fill="white" font-size="13" font-weight="700">4</text>
    <text x="870" y="230" font-size="13" font-weight="600" fill="#1E293B">Build Basic</text>
    <text x="870" y="248" font-size="13" font-weight="600" fill="#1E293B">JavaFX App</text>
  </g>

  <!-- Arrows row 1 -->
  <line x1="260" y1="245" x2="298" y2="245" stroke="#4A5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="520" y1="245" x2="558" y2="245" stroke="#4A5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="780" y1="245" x2="818" y2="245" stroke="#4A5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Down arrow to problem -->
  <line x1="930" y1="290" x2="930" y2="330" stroke="#4A5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Problem box -->
  <rect x="700" y="335" width="340" height="80" rx="10" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
  <text x="720" y="360" font-size="13" font-weight="700" fill="#B91C1C">⚠ Problem Encountered (Step 5)</text>
  <text x="720" y="380" font-size="12.5" fill="#7F1D1D">"JavaFX runtime components are missing"</text>
  <text x="720" y="398" font-size="12" fill="#7F1D1D">— runtime not loading when run from IDE</text>

  <!-- Arrow problem -> solution -->
  <line x1="700" y1="375" x2="580" y2="375" stroke="#4A5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Solution box -->
  <rect x="240" y="335" width="340" height="80" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
  <text x="260" y="360" font-size="13" font-weight="700" fill="#047857">✔ Solution (Step 6)</text>
  <text x="260" y="380" font-size="12.5" fill="#065F46">Configured JavaFX Maven Plugin</text>
  <text x="260" y="398" font-size="12.5" font-family="Consolas, monospace" fill="#065F46">mvn clean javafx:run</text>

  <!-- Arrow down to result -->
  <line x1="410" y1="415" x2="410" y2="460" stroke="#4A5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Result box -->
  <rect x="200" y="465" width="420" height="110" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="220" y="492" font-size="14" font-weight="700" fill="#1D4ED8">Result (Step 7)</text>
  <text x="220" y="516" font-size="13" fill="#1E3A8A">JavaFX window launched successfully via Maven</text>
  <rect x="220" y="530" width="380" height="34" rx="6" fill="#1E293B"/>
  <text x="410" y="552" text-anchor="middle" font-size="13" fill="#93C5FD" font-family="Consolas, monospace">"Hello! JavaFX is working."</text>

  <!-- Arrow to status -->
  <line x1="410" y1="575" x2="410" y2="615" stroke="#4A5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Status badge -->
  <rect x="280" y="620" width="260" height="50" rx="25" fill="#10B981"/>
  <text x="410" y="651" text-anchor="middle" font-size="16" font-weight="700" fill="white">✔ Phase 1 Completed</text>

  <!-- Next phase note -->
  <rect x="680" y="600" width="360" height="90" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="700" y="628" font-size="13" font-weight="700" fill="#92400E">Next: Phase 2</text>
  <text x="700" y="650" font-size="12.5" fill="#78350F">Ready to move towards browser</text>
  <text x="700" y="668" font-size="12.5" fill="#78350F">integration using WebView</text>

  <line x1="620" y1="645" x2="678" y2="645" stroke="#4A5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- App structure mini diagram -->
  <rect x="40" y="720" width="1020" height="150" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="60" y="748" font-size="14" font-weight="700" fill="#1E293B">Basic JavaFX Application Structure</text>

  <rect x="70" y="765" width="150" height="55" rx="8" fill="#DBEAFE" stroke="#3B82F6"/>
  <text x="145" y="798" text-anchor="middle" font-size="12.5" fill="#1E3A8A">Application</text>

  <line x1="220" y1="792" x2="258" y2="792" stroke="#4A5568" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="260" y="765" width="150" height="55" rx="8" fill="#DBEAFE" stroke="#3B82F6"/>
  <text x="335" y="798" text-anchor="middle" font-size="12.5" fill="#1E3A8A">start() method</text>

  <line x1="410" y1="792" x2="448" y2="792" stroke="#4A5568" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="450" y="765" width="130" height="55" rx="8" fill="#D1FAE5" stroke="#10B981"/>
  <text x="515" y="798" text-anchor="middle" font-size="12.5" fill="#065F46">Label</text>

  <line x1="580" y1="792" x2="618" y2="792" stroke="#4A5568" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="620" y="765" width="130" height="55" rx="8" fill="#D1FAE5" stroke="#10B981"/>
  <text x="685" y="798" text-anchor="middle" font-size="12.5" fill="#065F46">StackPane</text>

  <line x1="750" y1="792" x2="788" y2="792" stroke="#4A5568" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="790" y="765" width="110" height="55" rx="8" fill="#FDE68A" stroke="#D97706"/>
  <text x="845" y="798" text-anchor="middle" font-size="12.5" fill="#78350F">Scene</text>

  <line x1="900" y1="792" x2="938" y2="792" stroke="#4A5568" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="940" y="765" width="100" height="55" rx="8" fill="#FBCFE8" stroke="#DB2777"/>
  <text x="990" y="798" text-anchor="middle" font-size="12.5" fill="#831843">Stage</text>

  <text x="60" y="850" font-size="12" fill="#64748B">Flow: Application subclass → start() overridden → Label placed in StackPane → wrapped in Scene → shown via Stage</text>
</svg>
